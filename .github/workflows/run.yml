name: Generate Quiz Videos

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 2,8,14,20 * * *"

permissions:
  contents: write

concurrency:
  group: quiz-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify or install FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg already available on runner"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --prefer-binary -r requirements.txt

      - name: Prepare folders
        run: |
          mkdir -p data/history output
          if [ ! -f data/history/history.json ]; then
            echo '{"version": 3, "counters": {}, "last_run": {}}' > data/history/history.json
          fi

      - name: Generate all 8 subject quiz videos
        run: python app.py
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DEFER_INSTAGRAM_PUBLISH: "true"
          META_GRAPH_VERSION: v24.0
          TTS_VOICE: en-IN-NeerjaNeural
          TTS_RATE: +0%
          TTS_VOLUME: +0%
          PAGE_URL: ${{ secrets.PAGE_URL }}
          VIDEO_WIDTH: 720
          VIDEO_HEIGHT: 1280
          FPS: 30
          VIDEO_CRF: 30
          VIDEO_PRESET: ultrafast
          TTS_CONCURRENCY: 6

      - name: Validate 8 generated videos
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          pending = json.loads(Path("output/pending_publish.json").read_text(encoding="utf-8"))
          if not isinstance(pending, list) or len(pending) != 8:
              raise SystemExit(f"Expected exactly 8 pending quizzes, got {len(pending) if isinstance(pending, list) else 'invalid'}")
          for i, item in enumerate(pending, 1):
              if int(item.get("questions", 0)) != 10:
                  raise SystemExit(f"Subject {i} has {item.get('questions')} questions; expected 10")
              video = Path("output") / item["video_file"]
              if not video.is_file() or video.stat().st_size == 0:
                  raise SystemExit(f"Missing/empty video for subject {i}: {video}")
              print(f"{i}/8: {item['subject']} | {item['video_file']} | {video.stat().st_size} bytes")
          PY

      - name: Upload all 8 videos as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quiz-videos-${{ github.run_number }}
          path: |
            output/*.mp4
            output/pending_publish.json
          retention-days: 7

      - name: Publish all 8 subject videos to Instagram
        env:
          GH_TOKEN: ${{ github.token }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v24.0
        run: |
          set -euo pipefail

          if [ -z "$INSTAGRAM_BUSINESS_ACCOUNT_ID" ] || [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "::error::Instagram secrets are missing."
            exit 1
          fi

          VISIBILITY="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.visibility')"
          if [ "$VISIBILITY" != "public" ]; then
            echo "::error::Instagram automatic publishing requires this GitHub repository to be public."
            exit 1
          fi

          for INDEX in 0 1 2 3 4 5 6 7; do
            TAG="quiz-reel-${GITHUB_RUN_ID}-${INDEX}"
            VIDEO_FILE="$(INDEX="$INDEX" python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("output/pending_publish.json").read_text(encoding="utf-8"))
          print(data[int(os.environ["INDEX"])]["video_file"])
          PY
            )"

            if [ ! -f "output/${VIDEO_FILE}" ]; then
              echo "::error::Generated video not found: output/${VIDEO_FILE}"
              exit 1
            fi

            echo "============================================================"
            echo "Publishing subject index ${INDEX}: ${VIDEO_FILE}"
            echo "Release tag: ${TAG}"

            gh release create "$TAG" \
              "output/${VIDEO_FILE}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Quiz Reel ${GITHUB_RUN_NUMBER}-${INDEX}" \
              --notes "Temporary public MP4 used for Instagram Reel publishing."

            VIDEO_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${VIDEO_FILE}"
            echo "Public video URL: ${VIDEO_URL}"

            AVAILABLE=0
            for attempt in $(seq 1 12); do
              HTTP_CODE="$(curl -L -s -o /dev/null -w '%{http_code}' "$VIDEO_URL" || true)"
              echo "Release asset check ${attempt}/12: HTTP ${HTTP_CODE}"
              if [ "$HTTP_CODE" = "200" ]; then
                AVAILABLE=1
                break
              fi
              sleep 5
            done

            if [ "$AVAILABLE" -ne 1 ]; then
              echo "::error::GitHub release asset is not publicly downloadable: ${VIDEO_URL}"
              exit 1
            fi

            INSTAGRAM_VIDEO_URL="$VIDEO_URL" \
            PENDING_INDEX="$INDEX" \
            python publish.py

            echo "Cleaning temporary release ${TAG}"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done

          echo "✅ All 8 subject videos published successfully."

      - name: Commit quiz counters
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/history/history.json
          git commit -m "Update quiz source counters" || exit 0
          git pull --rebase origin main
          git push origin main

      - name: Cleanup temporary releases if a publish step failed
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          for INDEX in 0 1 2 3 4 5 6 7; do
            TAG="quiz-reel-${GITHUB_RUN_ID}-${INDEX}"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          done
